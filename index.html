<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/favicon.svg" type="image/x-icon" />
    <title>Curitiba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'DM Sans', system-ui;
        background-color: #1c1e1b;
        font-weight: 400;
        color: #fff;
        overflow-x: hidden;
      }

      nav {
        width: 100%;
        display: flex;
        border-radius: 0 0 12px 12px;
        position: fixed;
        justify-content: space-between;
        align-items: center;
        padding: 0 3rem;
        height: 72px;
        z-index: 1000;
        background: rgba(20, 22, 19, 0.72);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(201, 168, 76, 0.18);
      }

      .nav-text {
        font-family: 'Henny Penny', system-ui;
        font-size: 1.3rem;
        text-decoration: none;
        color: #c9a84c;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      .nav-text:hover {
        opacity: 0.75;
      }

      ul {
        display: flex;
        list-style: none;
        gap: 2rem;
      }

      li a {
        font-size: 0.85rem;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.75);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 500;
        transition: color 0.2s ease;
      }

      li a:hover {
        color: #c9a84c;
      }

      .hero {
        position: relative;
        height: 100vh;
        z-index: 100;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        padding: 0 4rem 5rem;
        overflow: hidden;
        background: url('./assets/bg-hero.jpg') no-repeat center center / cover;
      }
      
      .hero::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(10, 12, 9, 0.85) 0%,
          rgba(10, 12, 9, 0.3) 50%,
          transparent 100%
        );
        pointer-events: none;
      }

      .hero-content {
        position: relative;
        z-index: 2;
        max-width: 620px;
      }

      .hero-eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #c9a84c;
        margin-bottom: 1rem;
        font-weight: 500;
        opacity: 1;
        transform: translateY(12px);
        animation: fadeUp 0.7s ease 0.2s forwards;
      }

      .hero-content h1 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(3.5rem, 8vw, 6.5rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #f5f0e8;
        margin-bottom: 1.25rem;
        opacity: 1;
        transform: translateY(16px);
        animation: fadeUp 0.8s ease 0.35s forwards;
      }

      .hero-content p {
        font-size: 1.05rem;
        color: rgba(245, 240, 232, 0.7);
        line-height: 1.6;
        font-weight: 300;
        max-width: 440px;
        padding-left: 1rem;
        opacity: 1;
        transform: translateY(12px);
      }

    </style>
  </head>

  <body>
    <nav id="navbar">
      <a class="nav-text" href="#">History of Curitiba</a>
      <ul>
        <li><a href="#origem">Origem</a></li>
        <li><a href="#linha-tempo">Linha do Tempo</a></li>
        <li><a href="#urbanismo">Urbanismo</a></li>
        <li><a href="#cultura">Cultura</a></li>
        <li><a href="#curiosidades">Curiosidades</a></li>
      </ul>
    </nav>

    <section class="hero">
      <div class="hero-content">
        <p class="hero-eyebrow">História de Curitiba</p>
        <h1>Curitiba</h1>
        <p>Dos povos garimpeiros à cidade mais tecnológica do Brasil</p>
      </div>
    </section>

    <footer>
      
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
